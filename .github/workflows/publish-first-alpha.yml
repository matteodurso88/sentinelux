# One-shot metadata-only publishing workflow for Sentinelux's first public alpha.
# Triggered only when THIS file first lands on main. Does not build or test remotely.
name: Publish first Sentinelux alpha prerelease

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-first-alpha.yml

permissions: {}

jobs:
  publish-alpha:
    if: github.repository == 'matteodurso88/sentinelux' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact merged main commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check alpha package identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^version = "0[.]1[.]0a1"$' pyproject.toml
          grep -Eq '^__version__ = "0[.]1[.]0a1"$' src/sentinelux/__init__.py
          test -f docs/releases/GITHUB_RELEASE_NOTES.md
      - name: Publish GitHub prerelease (source archives only)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.1.0-alpha.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag"
            exit 0
          fi
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Sentinelux v0.1.0-alpha.1" \
            --prerelease \
            --notes-file docs/releases/GITHUB_RELEASE_NOTES.md
          gh release view "$tag" --json tagName,url,isPrerelease,isDraft
